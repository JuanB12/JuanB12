<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Gracias por visitar · Thanks for visiting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10284D"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', Consolas, Menlo, 'Courier New', monospace; }
      .wave { animation: drift 9s ease-in-out infinite alternate; }
      @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    </style>
    <clipPath id="frame"><rect width="1200" height="150" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="150" fill="url(#bg)"/>
    <path class="wave" d="M0 112 C 160 82, 320 142, 480 112 S 800 82, 960 112 S 1200 142, 1300 112 V150 H0 Z" fill="#3776AB" fill-opacity="0.35"/>
    <path class="wave" d="M0 126 C 180 106, 340 150, 520 126 S 860 104, 1020 126 S 1240 148, 1300 126 V150 H0 Z" fill="#FFD43B" fill-opacity="0.18"/>
  </g>
  <text x="600" y="62" text-anchor="middle" class="sans" font-size="26" font-weight="700" fill="#FFFFFF">Gracias por visitar · Thanks for visiting</text>
  <text x="600" y="92" text-anchor="middle" class="mono" font-size="15" fill="#FFD43B">while (vivo) { aprender(); compartir(); }</text>
</svg>
