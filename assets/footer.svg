<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Gracias por visitar · Thanks for visiting">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10284D"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#FFD43B"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
      <animate attributeName="x1" values="-1;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="170" rx="22"/></clipPath>
    <clipPath id="typing">
      <rect x="420" y="96" width="0" height="28">
        <animate attributeName="width" values="0;362;362;0;0" keyTimes="0;0.35;0.8;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', Consolas, Menlo, 'Courier New', monospace; }
      .flow-a { animation: flowA 12s linear infinite; }
      .flow-b { animation: flowB 8s linear infinite; }
      @keyframes flowA { from { transform: translateX(0); } to { transform: translateX(-600px); } }
      @keyframes flowB { from { transform: translateX(-400px); } to { transform: translateX(0); } }
      .p { animation: rise 6s ease-in infinite; opacity: 0; }
      @keyframes rise {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 0.9; }
        100% { transform: translateY(-120px); opacity: 0; }
      }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="170" fill="url(#bg)"/>

    <!-- partículas que suben -->
    <g fill="#FFD43B">
      <circle class="p" cx="90" cy="160" r="2.5" style="animation-delay:0s"/>
      <circle class="p" cx="230" cy="165" r="1.8" style="animation-delay:1.4s"/>
      <circle class="p" cx="360" cy="160" r="2.2" style="animation-delay:3.1s"/>
      <circle class="p" cx="840" cy="162" r="2" style="animation-delay:0.8s"/>
      <circle class="p" cx="980" cy="160" r="2.6" style="animation-delay:2.4s"/>
      <circle class="p" cx="1120" cy="166" r="1.8" style="animation-delay:4.2s"/>
    </g>
    <g fill="#7FB0D9">
      <circle class="p" cx="160" cy="166" r="1.6" style="animation-delay:2s"/>
      <circle class="p" cx="300" cy="162" r="2" style="animation-delay:4.8s"/>
      <circle class="p" cx="900" cy="166" r="1.6" style="animation-delay:3.6s"/>
      <circle class="p" cx="1060" cy="162" r="2.2" style="animation-delay:1s"/>
    </g>

    <!-- ondas en bucle continuo -->
    <path class="flow-b" d="M0 128 C100 112 300 144 400 128 S700 112 800 128 S1100 144 1200 128 S1500 112 1600 128 S1900 144 2000 128 V170 H0 Z" fill="#3776AB" fill-opacity="0.28"/>
    <g class="flow-a">
      <path d="M0 140 C150 120 450 160 600 140 S1050 120 1200 140 S1650 160 1800 140 S2250 120 2400 140 V170 H0 Z" fill="#10284D"/>
      <path d="M0 140 C150 120 450 160 600 140 S1050 120 1200 140 S1650 160 1800 140 S2250 120 2400 140" fill="none" stroke="#FFD43B" stroke-width="2" stroke-opacity="0.75"/>
    </g>
  </g>

  <text x="600" y="66" text-anchor="middle" class="sans" font-size="27" font-weight="700" fill="url(#title)">Gracias por visitar · Thanks for visiting</text>

  <!-- línea de código que se escribe sola -->
  <text x="420" y="116" class="mono" font-size="15" fill="#FFD43B" clip-path="url(#typing)">while (vivo) { aprender(); compartir(); }</text>
  <rect class="blink" x="422" y="102" width="8" height="18" fill="#FFD43B">
    <animate attributeName="x" values="422;786;786;422;422" keyTimes="0;0.35;0.8;0.9;1" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
