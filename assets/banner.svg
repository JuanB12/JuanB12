<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Juan Barrios — Backend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10284D"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.82" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#3776AB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3776AB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowYellow" cx="0.08" cy="0.95" r="0.35">
      <stop offset="0" stop-color="#FFD43B" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFD43B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9FB3D1" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9DCF5"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="340" rx="22"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, 'Courier New', monospace; }
      .chip text { font-size: 15px; font-weight: 600; fill: #DCE7F7; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#glowBlue)"/>
    <rect width="1200" height="340" fill="url(#glowYellow)"/>
    <!-- franja inferior de acento -->
    <rect y="334" width="1200" height="6" fill="#3776AB"/>
    <rect y="334" width="300" height="6" fill="#FFD43B"/>
  </g>

  <!-- Texto principal -->
  <g class="sans">
    <text x="64" y="92" class="mono" font-size="18" fill="#FFD43B">&lt;backend-developer /&gt;</text>
    <text x="62" y="160" font-size="66" font-weight="800" fill="url(#name)" letter-spacing="-1">Juan Barrios</text>
    <text x="64" y="200" font-size="21" fill="#9FB3D1">APIs con Python &amp; Flask · Bases de datos · IA aplicada</text>

    <!-- ubicación -->
    <g transform="translate(64 226)">
      <path d="M7 0C3.1 0 0 3.1 0 7c0 5.2 7 12 7 12s7-6.8 7-12c0-3.9-3.1-7-7-7zm0 9.6A2.6 2.6 0 1 1 7 4.4a2.6 2.6 0 0 1 0 5.2z" fill="#FFD43B"/>
      <text x="22" y="14" font-size="16" fill="#9FB3D1">Barranquilla, Colombia</text>
    </g>

    <!-- chips de stack -->
    <g class="chip" transform="translate(64 262)">
      <g><rect width="92" height="34" rx="17" fill="#3776AB" fill-opacity="0.22" stroke="#3776AB"/><text x="46" y="22" text-anchor="middle">Python</text></g>
      <g transform="translate(102 0)"><rect width="78" height="34" rx="17" fill="#3776AB" fill-opacity="0.22" stroke="#3776AB"/><text x="39" y="22" text-anchor="middle">Flask</text></g>
      <g transform="translate(190 0)"><rect width="96" height="34" rx="17" fill="#3776AB" fill-opacity="0.22" stroke="#3776AB"/><text x="48" y="22" text-anchor="middle">FastAPI</text></g>
      <g transform="translate(296 0)"><rect width="86" height="34" rx="17" fill="#FFD43B" fill-opacity="0.14" stroke="#FFD43B"/><text x="43" y="22" text-anchor="middle">PL/SQL</text></g>
      <g transform="translate(392 0)"><rect width="122" height="34" rx="17" fill="#FFD43B" fill-opacity="0.14" stroke="#FFD43B"/><text x="61" y="22" text-anchor="middle">PostgreSQL</text></g>
      <g transform="translate(524 0)"><rect width="66" height="34" rx="17" fill="#3776AB" fill-opacity="0.22" stroke="#3776AB"/><text x="33" y="22" text-anchor="middle">AWS</text></g>
    </g>
  </g>

  <!-- Ventana de código -->
  <g class="float">
    <g transform="translate(728 54)">
      <rect width="410" height="232" rx="14" fill="#0A1424" fill-opacity="0.92" stroke="#2A4672"/>
      <rect width="410" height="36" rx="14" fill="#122340"/>
      <rect y="22" width="410" height="14" fill="#122340"/>
      <circle cx="22" cy="18" r="6" fill="#FF5F57"/>
      <circle cx="42" cy="18" r="6" fill="#FEBC2E"/>
      <circle cx="62" cy="18" r="6" fill="#28C840"/>
      <text x="205" y="23" text-anchor="middle" class="mono" font-size="13" fill="#6F86A8">app.py</text>

      <g class="mono" font-size="15.5">
        <text x="22" y="70"><tspan fill="#C792EA">from</tspan><tspan fill="#DCE7F7"> flask </tspan><tspan fill="#C792EA">import</tspan><tspan fill="#FFD43B"> Flask</tspan></text>
        <text x="22" y="96"><tspan fill="#DCE7F7">app = </tspan><tspan fill="#FFD43B">Flask</tspan><tspan fill="#DCE7F7">(__name__)</tspan></text>
        <text x="22" y="132"><tspan fill="#82AAFF">@app.get</tspan><tspan fill="#DCE7F7">(</tspan><tspan fill="#C3E88D">"/juan"</tspan><tspan fill="#DCE7F7">)</tspan></text>
        <text x="22" y="158"><tspan fill="#C792EA">def</tspan><tspan fill="#82AAFF"> perfil</tspan><tspan fill="#DCE7F7">():</tspan></text>
        <text x="58" y="184" xml:space="preserve"><tspan fill="#C792EA">return</tspan><tspan fill="#DCE7F7"> {</tspan><tspan fill="#C3E88D">"rol"</tspan><tspan fill="#DCE7F7">: </tspan><tspan fill="#C3E88D">"backend"</tspan><tspan fill="#DCE7F7">,</tspan></text>
        <text x="130" y="210" xml:space="preserve"><tspan fill="#C3E88D">"ia"</tspan><tspan fill="#DCE7F7">: </tspan><tspan fill="#F78C6C">True</tspan><tspan fill="#DCE7F7">}</tspan></text>
      </g>
      <rect class="cursor" x="237" y="196" width="9" height="18" fill="#FFD43B"/>
    </g>
  </g>
</svg>
