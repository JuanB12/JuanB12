<svg xmlns="http://www.w3.org/2000/svg" width="440" height="44" viewBox="0 0 440 44" role="img" aria-label="Abierto a colaborar en proyectos backend">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#10284D"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #DCE7F7; }
      .onda { transform-box: fill-box; transform-origin: center; animation: onda 2s ease-out infinite; }
      @keyframes onda { from { transform: scale(1); opacity: .7; } to { transform: scale(3.2); opacity: 0; } }
    </style>
  </defs>
  <rect x="1" y="1" width="438" height="42" rx="21" fill="url(#bg)" stroke="#2A4672"/>
  <circle class="onda" cx="26" cy="22" r="5" fill="#28C840"/>
  <circle cx="26" cy="22" r="5" fill="#28C840"/>
  <text x="44" y="27">Abierto a colaborar en proyectos backend<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.30;0.33;0.97;1" dur="9s" repeatCount="indefinite"/></text>
  <text x="44" y="27" opacity="0">Open to backend collaborations 🌎<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.36;0.63;0.66;1" dur="9s" repeatCount="indefinite"/></text>
  <text x="44" y="27" opacity="0">Construyendo APIs con Python <tspan fill="#FFD43B">+ IA</tspan> 🐍<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.66;0.69;0.94;0.97;1" dur="9s" repeatCount="indefinite"/></text>
</svg>
