name: Actualizar perfil (serpiente y estadísticas)

on:
  schedule:
    - cron: "0 5 * * *" # todos los días a las 00:00 en Colombia
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  perfil:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generar serpiente
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3776AB&color_dots=#ebedf0,#c6dbef,#7fb0d9,#3776AB,#FFD43B
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFD43B&color_dots=#161b22,#123056,#1d4f80,#3776AB,#FFD43B

      - name: Generar tarjeta de estadísticas
        run: python scripts/stats.py "${{ github.repository_owner }}" dist/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
