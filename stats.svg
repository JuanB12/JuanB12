<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="292" viewBox="0 0 1000 292" role="img" aria-label="Estadísticas de GitHub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#0F2342"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barra"><rect x="540" y="104" width="428" height="14" rx="7"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #FFD43B; }
      .sub { font-size: 13px; fill: #6F86A8; }
      .label { font-size: 13px; fill: #9FB3D1; }
      .num { font-size: 30px; font-weight: 800; fill: #FFFFFF; }
      .leg { font-size: 14px; fill: #DCE7F7; }
      .pct { fill: #9FB3D1; }
      .up { opacity: 0; animation: up .7s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .grow { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow .9s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes grow { to { transform: scaleX(1); } }
      .shine { animation: shine 3.5s ease-in-out 1.5s infinite; }
      @keyframes shine { from { transform: translateX(-140px); } to { transform: translateX(568px); } }
      .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.6); } }
    </style>
  </defs>
  <rect width="1000" height="292" rx="20" fill="url(#bg)" stroke="#1F3557"/>

  <text x="32" y="46" class="title">Mi actividad en GitHub</text>
  <circle cx="844" cy="40" r="5" fill="#28C840" class="pulse"/>
  <text x="856" y="45" class="sub">actualizado a diario</text>
  
    <g transform="translate(32 74)">
      <rect width="216" height="78" rx="14" fill="#10203A" stroke="#1F3557"/>
      <rect width="4" height="40" x="0" y="19" rx="2" fill="#3776AB"/>
      <text x="20" y="28" class="label">Contribuciones (último año)</text>
      <text x="20" y="62" class="num up" style="animation-delay:0.15s">331</text>
    </g>
    <g transform="translate(264 74)">
      <rect width="216" height="78" rx="14" fill="#10203A" stroke="#1F3557"/>
      <rect width="4" height="40" x="0" y="19" rx="2" fill="#FFD43B"/>
      <text x="20" y="28" class="label">Repositorios públicos</text>
      <text x="20" y="62" class="num up" style="animation-delay:0.33s">20</text>
    </g>
    <g transform="translate(32 166)">
      <rect width="216" height="78" rx="14" fill="#10203A" stroke="#1F3557"/>
      <rect width="4" height="40" x="0" y="19" rx="2" fill="#3776AB"/>
      <text x="20" y="28" class="label">Estrellas recibidas</text>
      <text x="20" y="62" class="num up" style="animation-delay:0.51s">0</text>
    </g>
    <g transform="translate(264 166)">
      <rect width="216" height="78" rx="14" fill="#10203A" stroke="#1F3557"/>
      <rect width="4" height="40" x="0" y="19" rx="2" fill="#FFD43B"/>
      <text x="20" y="28" class="label">Seguidores</text>
      <text x="20" y="62" class="num up" style="animation-delay:0.69s">5</text>
    </g>

  <text x="540" y="88" class="label">Lenguajes más usados</text>
  <rect x="540" y="104" width="428" height="14" rx="7" fill="#10203A"/>
  <g clip-path="url(#barra)">
    <rect x="540.0" y="104" width="185.2" height="14" fill="#3776AB" class="grow" style="animation-delay:0.30s"/><rect x="725.2" y="104" width="94.1" height="14" fill="#FFD43B" class="grow" style="animation-delay:0.42s"/><rect x="819.3" y="104" width="27.6" height="14" fill="#4E9BCD" class="grow" style="animation-delay:0.54s"/><rect x="846.9" y="104" width="24.4" height="14" fill="#C9A227" class="grow" style="animation-delay:0.66s"/><rect x="871.3" y="104" width="24.4" height="14" fill="#7FB0D9" class="grow" style="animation-delay:0.78s"/><rect x="895.7" y="104" width="18.7" height="14" fill="#9FB3D1" class="grow" style="animation-delay:0.90s"/>
    <rect class="shine" x="540" y="104" width="120" height="14" fill="url(#brillo)"/>
  </g>
  
    <g class="up" style="animation-delay:0.60s">
      <circle cx="546" cy="147" r="6" fill="#3776AB"/>
      <text x="560" y="152" class="leg">Dart <tspan class="pct">43.3%</tspan></text>
    </g>
    <g class="up" style="animation-delay:0.70s">
      <circle cx="766" cy="147" r="6" fill="#FFD43B"/>
      <text x="780" y="152" class="leg">Java <tspan class="pct">22.0%</tspan></text>
    </g>
    <g class="up" style="animation-delay:0.80s">
      <circle cx="546" cy="177" r="6" fill="#4E9BCD"/>
      <text x="560" y="182" class="leg">CSS <tspan class="pct">6.4%</tspan></text>
    </g>
    <g class="up" style="animation-delay:0.90s">
      <circle cx="766" cy="177" r="6" fill="#C9A227"/>
      <text x="780" y="182" class="leg">HTML <tspan class="pct">5.7%</tspan></text>
    </g>
    <g class="up" style="animation-delay:1.00s">
      <circle cx="546" cy="207" r="6" fill="#7FB0D9"/>
      <text x="560" y="212" class="leg">SCSS <tspan class="pct">5.7%</tspan></text>
    </g>
    <g class="up" style="animation-delay:1.10s">
      <circle cx="766" cy="207" r="6" fill="#9FB3D1"/>
      <text x="780" y="212" class="leg">C++ <tspan class="pct">4.4%</tspan></text>
    </g>

  <text x="32" y="274" class="sub">En GitHub desde 2022 · 4 años aprendiendo y construyendo</text>
</svg>
